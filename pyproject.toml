    [build-system]
    requires = ["setuptools>=69"]
    build-backend = "setuptools.build_meta"
    [project]
    name = "financial-report-rag"
    version = "0.2.0"
    description = "Reproducible learning project with explicit experiment provenance"
    requires-python = ">=3.11,<3.13"
    dependencies = ["numpy==2.2.6", "scikit-learn==1.6.1", "faiss-cpu==1.11.0", "pdfplumber==0.11.9", "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1"]
    [project.optional-dependencies]
neural = ["sentence-transformers==4.1.0", "transformers==4.52.4", "torch==2.7.1"]
bge = ["FlagEmbedding==1.3.5", "transformers==4.52.4"]
    [tool.setuptools.packages.find]
    where = ["src"]
    [tool.pytest.ini_options]
    pythonpath = ["src"]
    testpaths = ["tests"]
